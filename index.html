<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#245edb">
  <meta name="description" content="Kelvin Rutatina builds local-first AI systems, security automation, and practical infrastructure.">
  <meta property="og:title" content="Kelvin's Portifolio Computer">
  <meta property="og:description" content="Kelvin Rutatina's working Windows XP-style portfolio computer.">
  <title>Kelvin's Portifolio Computer</title>
  <link rel="icon" href="assets/runtime/icons/my-computer.png">
  <link rel="stylesheet" href="css/style.css?v=10">
  <script type="application/ld+json">
    {"@context":"https://schema.org","@type":"Person","name":"Kelvin Rutatina","url":"https://github.com/Kevinscki","sameAs":["https://github.com/Kevinscki","https://medium.com/@kelvinrutatina","https://linkedin.com/in/kelvinrutatina"],"knowsAbout":["Local AI infrastructure","Cybersecurity","Security automation","LLM security"]}
  </script>
</head>
<body>
  <a class="skip-link" href="#desktop-icons">Skip to desktop icons</a>

  <div id="boot-screen" aria-label="Starting portifolio XP">
    <img class="boot-logo" src="assets/runtime/icons/WINDOW icon.png" alt="" width="118" height="118">
    <div class="boot-wordmark"><span>portifolio</span><sup>xp</sup></div>
    <div class="boot-track" aria-hidden="true"><div class="boot-blocks"><i></i><i></i><i></i></div></div>
  </div>

  <main id="desktop" aria-label="Kelvin's Portifolio Computer desktop">
    <section id="desktop-icons" class="desktop-icons" aria-label="Desktop applications"></section>
    <div id="window-layer" aria-live="polite"></div>

    <aside id="clippy" aria-label="Clippy portfolio assistant">
      <section id="clippy-balloon" class="clippy-balloon" aria-live="polite">
        <button id="clippy-close" class="clippy-close" type="button" aria-label="Hide message">×</button>
        <p id="clippy-message"></p>
        <div id="clippy-links" class="clippy-links"></div>
      </section>
      <button id="clippy-character" class="clippy-character" type="button" aria-label="Show Clippy message" aria-expanded="true">
        <picture>
          <source media="(prefers-reduced-motion: reduce)" srcset="assets/runtime/clippy/still.png">
          <img id="clippy-image" src="assets/runtime/clippy/wakeup.webp" alt="Clippy, the animated portfolio assistant" width="240" height="240">
        </picture>
      </button>
    </aside>

    <nav class="taskbar" aria-label="Windows taskbar">
      <button id="start-button" type="button" aria-label="Start" aria-expanded="false"><img src="assets/runtime/icons/start-button.png?v=1" alt=""></button>
      <div id="task-buttons" aria-label="Open windows"></div>
      <div class="tray"><span aria-hidden="true">🔊</span><time id="clock">00:00</time></div>
    </nav>

    <aside id="start-menu" aria-hidden="true">
      <header><span class="avatar">KR</span><strong>Kelvin Rutatina</strong></header>
      <div class="start-menu-body">
        <div id="start-apps" class="start-apps"></div>
        <div class="start-places">
          <a href="#computer" data-open="computer">My Computer</a>
          <a href="#cv" data-open="cv">My Documents</a>
          <a href="#socials" data-open="socials">My Network Places</a>
          <a href="#terminal" data-open="terminal">Run...</a>
        </div>
      </div>
      <footer><span>Arusha, Tanzania</span><button id="logoff" type="button">Log Off</button></footer>
    </aside>
  </main>

  <template id="window-template">
    <section class="window" role="dialog" aria-modal="false">
      <header class="titlebar">
        <div class="titlebar-label"><img class="title-icon" alt=""><strong class="window-title"></strong></div>
        <div class="window-controls">
          <button type="button" data-action="minimize" aria-label="Minimize">_</button>
          <button type="button" data-action="maximize" aria-label="Maximize">□</button>
          <button type="button" data-action="close" aria-label="Close">×</button>
        </div>
      </header>
      <nav class="menubar" aria-label="Window menu">
        <div class="menu-root">
          <button class="menu-trigger" type="button" aria-expanded="false">File</button>
          <div class="menu-popup">
            <div class="submenu-root" tabindex="0"><span>Go To</span><span aria-hidden="true">▶</span>
              <div class="submenu-popup">
                <button type="button" data-open="computer">C:\</button>
                <button type="button" data-open="projects">Projects</button>
                <button type="button" data-open="academics">Academics</button>
                <button type="button" data-open="writing">Write-Ups</button>
                <button type="button" data-open="socials">Socials</button>
                <button type="button" data-open="cv">CV</button>
                <button type="button" data-open="terminal">Command Prompt</button>
              </div>
            </div>
          </div>
        </div>
        <button type="button">Edit</button><button type="button">View</button><button type="button">Favorites</button><button type="button">Tools</button><button type="button">Help</button>
      </nav>
      <div class="toolbar"><button class="nav-back" type="button" aria-label="Back"><b aria-hidden="true">←</b> Back <small aria-hidden="true">▼</small></button><button class="nav-forward" type="button" aria-label="Forward">→</button><button class="nav-up" type="button" aria-label="Up one level">↑</button><i aria-hidden="true"></i><button class="nav-search" type="button"><b aria-hidden="true">⌕</b> Search</button><button class="nav-folders" type="button"><b aria-hidden="true">▤</b> Folders</button></div>
      <form class="addressbar" autocomplete="off"><label>Address</label><input class="address-value" aria-label="Location" spellcheck="false"><button class="address-go" type="submit">Go</button></form>
      <div class="window-content"></div>
      <footer class="statusbar"><span class="status-text"></span><span>Local intranet</span></footer>
    </section>
  </template>

  <noscript>
    <section class="noscript-content">
      <h1>Kelvin Rutatina</h1>
      <p>Cybersecurity engineer working across local AI infrastructure, LLM security, automation, and Linux systems.</p>
      <p><a href="https://github.com/Kevinscki">GitHub</a> · <a href="https://medium.com/@kelvinrutatina">Medium</a> · <a href="downloads/Kelvin_Rutatina_CV.pdf">CV (PDF)</a></p>
    </section>
  </noscript>

  <script src="js/main.js?v=10"></script>
</body>
</html>
